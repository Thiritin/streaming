name: Laravel

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  laravel-tests:

    runs-on: ubuntu-latest

    steps:
      - uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
        with:
          php-version: '8.5'
      - uses: shogo82148/actions-setup-mysql@v1
        with:
          mysql-version: '8.0'
          user: 'identity'
          password: 'identity'
          auto-start: 'true'
      - run: mysql -uroot -h127.0.0.1 -e 'CREATE DATABASE identity;'
      - uses: actions/checkout@v3
      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"
      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
      - name: Generate key
        run: php artisan key:generate
      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache
      # public/build is gitignored, so without this every test that renders an Inertia
      # page dies on "Vite manifest not found" - 115 of them.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Build assets
        run: |
          npm ci
          npm run build
      - name: Execute tests (Unit and Feature tests) via PHPUnit
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: identity
          DB_USERNAME: root
          DB_PASSWORD: ""
        # Not `vendor/bin/pest`: Pest is not a dependency of this project and never has
        # been, so this step had exited 127 on every run since the workflow was added.
        # The suite is PHPUnit, as the step name already said.
        run: php artisan test
