name: Support images

# The origin stack pulls two images that are not the Laravel app: the FFmpeg
# transcoder and the HLS archive uploader. Nothing built them.
#
# docker.yml builds the root Dockerfile only, so `ffmpeg-hls` had not been
# rebuilt since 2025-08-31 and `archive-uploader` had never been published
# at all - the directory was renamed from dvr-uploader without an image following it.
# Provisioning an origin therefore failed at `docker compose up` with "pull access
# denied", and even a successful pull would have run a transcoder from before the DVR
# window, the orphan reaper, the stall watchdog and source archiving existed.
#
# Tagged the same way as the app image so an origin can be pinned to a release rather
# than tracking whatever `latest` happens to be mid-event.

on:
  release:
    types: [created]
  push:
    branches: [main]
    paths:
      - 'docker/ffmpeg-hls/**'
      - 'docker/archive-uploader/**'
      - '.github/workflows/docker-support-images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ffmpeg-hls
            context: docker/ffmpeg-hls
          - image: archive-uploader
            context: docker/archive-uploader
    steps:
      - uses: actions/checkout@v4

      - name: Prepare owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.OWNER }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
