# Bridge from the container network to the host-served Laravel app.
#
# Yerd matches sites by hostname and redirects plain HTTP to HTTPS, so a
# container asking for http://host.docker.internal/... gets "No site matches
# this Host" or a 301 that SRS treats as a failed webhook. This container
# accepts plain HTTP, then forwards to https://streaming.test with the Host
# header Yerd expects and without verifying its self-signed certificate.
#
# In production none of this exists: SRS and nginx reach the app directly.

server {
    listen 80;
    server_name _;

    # streaming.test resolves to the host gateway via extra_hosts in the compose file.
    resolver 127.0.0.11 ipv6=off;

    location / {
        proxy_pass https://streaming.test;

        proxy_ssl_verify off;
        proxy_ssl_server_name on;

        proxy_set_header Host streaming.test;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        # Webhooks are small and should fail fast rather than hold a stream open.
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_redirect off;
    }
}
